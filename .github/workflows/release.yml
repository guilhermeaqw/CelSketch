name: Build & Release CelSketch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux --publish never
      - name: Upload Linux binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-celsketch/*.AppImage
            release-celsketch/*.deb
